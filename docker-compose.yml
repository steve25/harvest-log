services:
  backend:
    build:
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile.dev}
    container_name: harvest-backend
    ports:
      - '8000:8000'
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: db
      DB_DATABASE: harvest
      DB_USERNAME: harvest_user
      DB_PASSWORD: ${DB_PASSWORD:-securepassword}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000']
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - dev
      - prod

  frontend:
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.dev}
    container_name: harvest-frontend
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5173']
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - dev
      - prod

  db:
    image: mysql:8.0
    container_name: harvest-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: harvest
      MYSQL_USER: harvest_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-securepassword}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - prod

  nginx:
    image: nginx:alpine
    container_name: harvest-nginx
    ports:
      - '80:80'
    volumes:
      - ${NGINX_CONF:-./nginx/nginx.dev.conf}:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost']
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - dev
      - prod

volumes:
  db_data:
