services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: harvest-backend
    ports:
      - '8000:8000'
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: db
      DB_DATABASE: harvest
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: harvest-frontend
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: harvest-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: harvest
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - '3306:3306'
  nginx:
    image: nginx:alpine
    container_name: harvest-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
