events {}

http {
    server {
        listen 80;

        # Presmeruj API požiadavky na Laravel
        location /api/ {
            proxy_pass http://harvest-backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ak používate cookies cez cross-origin požiadavky, pridaj:
            proxy_set_header Cookie $http_cookie;
        }

        # Frontend (vývojový server alebo build)
        location / {
            proxy_pass http://harvest-frontend:5173/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
